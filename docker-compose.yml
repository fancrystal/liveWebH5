version: '3.8'

services:
  # SRS WebRTC / RTMP media server
  srs:
    image: registry.cn-hangzhou.aliyuncs.com/ossrs/srs:5
    container_name: live-srs
    restart: unless-stopped
    environment:
      - CANDIDATE=172.21.0.15   # Server's public/LAN IP for WebRTC ICE
      - SRS_DAEMON=off
      - SRS_IN_DOCKER=on
    ports:
      - "1935:1935"       # RTMP
      - "1985:1985"       # HTTP API / WHIP
      - "8000:8000/udp"   # WebRTC UDP
      - "8081:8080"       # HTTP console

  # RTMP relay — WebSocket → ffmpeg → RTMP
  rtmp-relay:
    build: ./rtmp-relay
    container_name: live-rtmp-relay
    restart: unless-stopped
    environment:
      - PORT=8080
      - FFMPEG_PATH=ffmpeg
    # Port is NOT exposed externally; nginx proxies /rtmp-relay → this container

  # Nginx — serves the built frontend
  nginx:
    image: nginx:alpine
    container_name: live-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # nginx upstream addresses for proxied services.
      # Local dev: same machine, services exposed on localhost.
      NGINX_WHIP_UPSTREAM: "http://host.docker.internal:20080/index/api/whip"
      NGINX_IM_UPSTREAM:   "https://host.docker.internal:15830"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.template.conf:/etc/nginx/templates/default.conf.template:ro
      - ./start-nginx.sh:/start-nginx.sh:ro
    entrypoint: ["/bin/sh", "/start-nginx.sh"]
    depends_on:
      - srs
      - rtmp-relay

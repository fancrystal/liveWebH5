map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # WebSocket proxy → rtmp-relay container
    # Browser connects: ws://host/rtmp-relay?rtmp=rtmp://...
    # ------------------------------------------------------------------
    location /rtmp-relay {
        # rtmp-relay Service 在 K8s 里把容器 8080 暴露成 14118
        # 同 namespace 直接用 Service 名访问
        proxy_pass         http://rtmp-relay:14118/rtmp-relay;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;   # keep long-lived WS connections alive
        proxy_send_timeout 3600s;
    }

    # Vue Router history mode — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Allow large body for potential file uploads
    client_max_body_size 50m;

    # .mjs modules (pdf.worker.mjs, etc.)
    location ~* \.mjs$ {
        add_header Content-Type application/javascript;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # CORS headers for WebRTC / WHIP requests (proxied via nginx if needed)
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type";
}
